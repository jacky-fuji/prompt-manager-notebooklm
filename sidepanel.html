<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>CueCard for NotebookLM</h1>
        </header>

        <!-- 共通コントロールエリア -->
        <div class="common-controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="プロンプトを検索...">
            </div>
            <div id="tag-cloud" class="tag-cloud">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- カテゴリ別アコーディオン -->
        <div id="select-section">
            <div id="prompt-list-container">
                <section class="category-section" data-category="research">
                    <div class="category-header" id="header-research">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">リサーチ (Research)</span>
                        </div>
                        <button class="btn-add-category" data-category="research" title="リサーチにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="settings-panel" style="margin-bottom: 8px;">
                            <div class="setting-item">
                                <span class="setting-label">Deep Research をデフォルトにする</span>
                                <label class="switch">
                                    <input type="checkbox" id="setting-auto-deep-research">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="cue-list" id="list-research"></div>
                    </div>
                </section>

                <section class="category-section" data-category="audio">
                    <div class="category-header" id="header-audio">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">音声解説 (Audio Commentary)</span>
                        </div>
                        <button class="btn-add-category" data-category="audio" title="音声解説にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="settings-panel" style="margin-bottom: 8px;">
                            <div class="setting-item">
                                <span class="setting-label">デフォルト形式</span>
                                <select id="setting-audio-format" class="setting-select">
                                    <option value="">(自動選択なし)</option>
                                    <option value="詳細">詳細</option>
                                    <option value="概要">概要</option>
                                    <option value="評論">評論</option>
                                    <option value="議論">議論</option>
                                </select>
                            </div>
                        </div>
                        <div class="cue-list" id="list-audio"></div>
                    </div>
                </section>

                <section class="category-section" data-category="video">
                    <div class="category-header" id="header-video">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">動画解説 (Video Commentary)</span>
                        </div>
                        <button class="btn-add-category" data-category="video" title="動画解説にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-video"></div>
                    </div>
                </section>

                <section class="category-section" data-category="report">
                    <div class="category-header" id="header-report">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">レポート</span>
                        </div>
                        <button class="btn-add-category" data-category="report" title="レポートにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-report"></div>
                    </div>
                </section>

                <section class="category-section" data-category="flashcard">
                    <div class="category-header" id="header-flashcard">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">フラッシュカード</span>
                        </div>
                        <button class="btn-add-category" data-category="flashcard" title="フラッシュカードにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-flashcard"></div>
                    </div>
                </section>

                <section class="category-section" data-category="quiz">
                    <div class="category-header" id="header-quiz">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">クイズ</span>
                        </div>
                        <button class="btn-add-category" data-category="quiz" title="クイズにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-quiz"></div>
                    </div>
                </section>

                <section class="category-section" data-category="infographic">
                    <div class="category-header" id="header-infographic">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">インフォグラフィック</span>
                        </div>
                        <button class="btn-add-category" data-category="infographic"
                            title="インフォグラフィックにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-infographic"></div>
                    </div>
                </section>

                <section class="category-section" data-category="slide">
                    <div class="category-header" id="header-slide">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">スライド資料</span>
                        </div>
                        <button class="btn-add-category" data-category="slide" title="スライド資料にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-slide"></div>
                    </div>
                </section>

                <section class="category-section" data-category="datatable">
                    <div class="category-header" id="header-datatable">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title">Data Table</span>
                        </div>
                        <button class="btn-add-category" data-category="datatable"
                            title="Data Tableにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-datatable"></div>
                    </div>
                </section>
            </div>
        </div>

        <!-- プロンプトの追加・編集フォーム（常時表示） -->
        <div id="admin-section" class="admin-section">
            <h2 id="admin-title">プロンプトの追加</h2>
            <input type="hidden" id="edit-index" value="-1">

            <div style="position: relative;">
                <input type="text" id="prompt-title" placeholder="タイトル（例: 銘柄分析）" maxlength="10">
                <div id="title-char-count" style="font-size: 10px; color: #888; text-align: right; margin-top: -4px;">0
                    / 10</div>
            </div>

            <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 12px; color: #64748b; margin-bottom: 4px; display: block;">カテゴリ</label>
                <select id="prompt-category"
                    style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px;">
                    <option value="research">リサーチ (Research)</option>
                    <option value="audio">音声解説 (Audio Commentary)</option>
                    <option value="video">動画解説 (Video Commentary)</option>
                    <option value="report">レポート</option>
                    <option value="flashcard">フラッシュカード</option>
                    <option value="quiz">クイズ</option>
                    <option value="infographic">インフォグラフィック</option>
                    <option value="slide">スライド資料</option>
                    <option value="datatable">Data Table</option>
                </select>
            </div>

            <div style="position: relative;">
                <input type="text" id="prompt-tags" placeholder="タグ (カンマ区切り、例: 調査, 分析)">
                <div id="tags-char-count" style="font-size: 10px; color: #888; text-align: right; margin-top: -4px;">0 /
                    10個</div>
            </div>

            <div style="position: relative;">
                <textarea id="prompt-text" rows="6" placeholder="プロンプト内容" maxlength="5000"></textarea>
                <div id="char-count" style="font-size: 10px; color: #888; text-align: right; margin-top: -4px;">0 / 5000
                </div>
            </div>

            <label
                style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; margin: 4px 0;">
                <input type="checkbox" id="prompt-favorite" style="width: auto; margin: 0;"> ⭐ お気に入り登録
            </label>

            <div class="btn-group">
                <button id="save-btn" class="btn btn-primary">保存</button>
                <button id="cancel-btn" class="btn btn-secondary">クリア</button>
            </div>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>

</html>
