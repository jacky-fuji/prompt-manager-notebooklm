<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <img src="icon/icon48.png" alt="CueCard" class="header-icon">
                <h1 data-i18n="app-title">Prompt Manager for NotebookLM</h1>
            </div>
            <div class="header-right">
                <span data-i18n="label-language" class="language-label">言語</span>
                <div class="custom-lang-select" id="custom-lang-select">
                    <div class="custom-lang-trigger" id="custom-lang-trigger">🇺🇸 English</div>
                    <div class="custom-lang-options" id="custom-lang-options">
                        <div class="custom-lang-option" data-value="en">🇺🇸 English</div>
                        <div class="custom-lang-option" data-value="es">🇪🇸 Español</div>
                        <div class="custom-lang-option" data-value="fr">🇫🇷 Français</div>
                        <div class="custom-lang-option" data-value="de">🇩🇪 Deutsch</div>
                        <div class="custom-lang-option" data-value="pt">🇧🇷 Português</div>
                        <div class="custom-lang-option" data-value="it">🇮🇹 Italiano</div>
                        <div class="custom-lang-option" data-value="ru">🇷🇺 Русский</div>
                        <div class="custom-lang-option" data-value="ja">🇯🇵 日本語</div>
                        <div class="custom-lang-option" data-value="zh">🇨🇳 中文</div>
                        <div class="custom-lang-option" data-value="ko">🇰🇷 한국어</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Common controls area -->
        <div class="common-controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="保存済みのプロンプトを検索..."
                    data-i18n-placeholder="search-placeholder">
            </div>
            <div id="tag-cloud" class="tag-cloud">
                <!-- Dynamically generated -->
            </div>
        </div>

        <!-- Category-specific accordion -->
        <div id="select-section">
            <div id="prompt-list-container">
                <!-- Category sections are dynamically generated by sidepanel.js -->
            </div>
        </div>

        <!-- Prompt add/edit form (always visible) -->
        <div id="admin-section" class="admin-section">
            <h2 id="admin-title" data-i18n="admin-add-title">プロンプトの追加</h2>
            <input type="hidden" id="edit-index" value="-1">

            <div style="position: relative;">
                <input type="text" id="prompt-title" placeholder="タイトル（例: 銘柄分析）" maxlength="20"
                    data-i18n-placeholder="placeholder-title">
                <div id="title-char-count" class="char-counter">0 / 20</div>
            </div>

            <div class="form-group" style="margin-bottom: 4px;">
                <label style="font-size: 12px; color: #64748b; margin-bottom: 4px; display: block;"
                    data-i18n="label-category">カテゴリ</label>
                <select id="prompt-category"
                    style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px;">
                    <option value="research" data-i18n="cat-research">ソース検索</option>
                    <option value="chat" data-i18n="cat-chat">チャット</option>
                    <option value="audio" data-i18n="cat-audio">音声解説</option>
                    <option value="video" data-i18n="cat-video">動画解説</option>
                    <option value="report" data-i18n="cat-report">レポート</option>
                    <option value="flashcard" data-i18n="cat-flashcard">フラッシュカード</option>
                    <option value="quiz" data-i18n="cat-quiz">クイズ</option>
                    <option value="infographic" data-i18n="cat-infographic">インフォグラフィック</option>
                    <option value="slide" data-i18n="cat-slide">スライド資料</option>
                    <option value="datatable" data-i18n="cat-datatable">Data Table</option>
                </select>
            </div>

            <div id="video-subcategory-group" class="form-group" style="display: none; margin-bottom: 4px;">
                <label style="font-size: 12px; color: #64748b; margin-bottom: 4px; display: block;"
                    data-i18n="label-video-subcategory">対象エリア</label>
                <div style="display: flex; gap: 16px; padding: 4px 0; flex-wrap: nowrap;">
                    <label
                        style="display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; white-space: nowrap;">
                        <input type="radio" name="video-subcategory" id="video-sub-focus" value="focus" checked>
                        <span data-i18n="opt-video-focus">AIホストの焦点</span>
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; white-space: nowrap; margin-left: 8px;">
                        <input type="radio" name="video-subcategory" id="video-sub-style" value="style">
                        <span data-i18n="opt-video-custom-style">カスタムビジュアルスタイル</span>
                    </label>
                </div>
                <input type="hidden" id="prompt-video-subcategory" value="focus">
            </div>

            <div id="chat-subcategory-group" class="form-group" style="display: none; margin-bottom: 4px;">
                <label style="font-size: 12px; color: #64748b; margin-bottom: 4px; display: block;"
                    data-i18n="label-chat-subcategory">対象エリア</label>
                <div style="display: flex; gap: 16px; padding: 4px 0; flex-wrap: nowrap;">
                    <label
                        style="display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; white-space: nowrap;">
                        <input type="radio" name="chat-subcategory" id="chat-sub-main" value="chat" checked>
                        <span data-i18n="opt-chat-main">チャット</span>
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; white-space: nowrap; margin-left: 8px;">
                        <input type="radio" name="chat-subcategory" id="chat-sub-style" value="style">
                        <span data-i18n="opt-chat-style">会話のスタイル</span>
                    </label>
                </div>
                <input type="hidden" id="prompt-chat-subcategory" value="chat">
            </div>

            <div style="position: relative;">
                <div id="tags-input-container" class="tags-input-container">
                    <input type="text" id="prompt-tags-input" placeholder="タグ (Enterで追加)"
                        data-i18n-placeholder="placeholder-tags">
                </div>
                <input type="hidden" id="prompt-tags">
                <div id="tags-char-count" class="char-counter">0 / 10個</div>
            </div>

            <div style="position: relative;">
                <textarea id="prompt-text" rows="18" placeholder="プロンプト内容" maxlength="10000"
                    data-i18n-placeholder="placeholder-text"></textarea>
                <div id="char-count" class="char-counter">0 / 10,000</div>
            </div>

            <label
                style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; margin: 2px 0;">
                <input type="checkbox" id="prompt-favorite" style="width: auto; margin: 0;">
                <span data-i18n="label-favorite">⭐ お気に入り登録</span>
            </label>

            <div class="btn-group">
                <button id="save-btn" class="btn btn-primary" data-i18n="btn-save">保存</button>
                <button id="cancel-btn" class="btn btn-secondary" data-i18n="btn-cancel">キャンセル</button>
            </div>
        </div>

        <!-- Data Management Section -->
        <div id="data-management-section">
            <h3 data-i18n="data-management"></h3>
            <div class="data-actions">
                <button id="btn-export" class="btn-data" data-i18n="btn-export"></button>
                <button id="btn-import-trigger" class="btn-data" data-i18n="btn-import"></button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
            </div>
        </div>

        <div id="version-display"
            style="text-align: right; font-size: 11px; color: #94a3b8; padding: 4px 12px 12px 12px;">v1.3.2</div>
    </div>
    <div id="custom-confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="confirm-title" data-i18n="app-title">Prompt Manager for NotebookLM</h3>
            <p id="confirm-message"></p>
            <div class="btn-group">
                <button id="confirm-yes-btn" class="btn btn-primary">削除</button>
                <button id="confirm-no-btn" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>
    <script src="translations.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
