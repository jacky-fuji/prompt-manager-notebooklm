<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <img src="icon48.png" alt="CueCard" class="header-icon">
                <h1 data-i18n="app-title">Prompt Manager for NotebookLM</h1>
            </div>
            <div class="header-right">
                <span data-i18n="label-language" class="language-label">言語切替</span>
                <select id="language-select" class="language-select">
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </header>

        <!-- 共通コントロールエリア -->
        <div class="common-controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="保存済みのプロンプトを検索..."
                    data-i18n-placeholder="search-placeholder">
            </div>
            <div id="tag-cloud" class="tag-cloud">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- カテゴリ別アコーディオン -->
        <div id="select-section">
            <div id="prompt-list-container">
                <section class="category-section" data-category="research">
                    <div class="category-header" id="header-research">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-research">ソース検索</span>
                        </div>
                        <button class="btn-add-category" data-category="research" title="ソース検索にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="settings-panel" style="margin-bottom: 8px;">
                            <div class="setting-item">
                                <span class="setting-label" data-i18n="setting-deep-research">Deep Research
                                    をデフォルトにする</span>
                                <label class="switch">
                                    <input type="checkbox" id="setting-auto-deep-research">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                        <div class="cue-list" id="list-research"></div>
                    </div>
                </section>

                <section class="category-section" data-category="audio">
                    <div class="category-header" id="header-audio">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-audio">音声解説</span>
                        </div>
                        <button class="btn-add-category" data-category="audio" title="音声解説にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="settings-panel" style="margin-bottom: 8px;">
                            <div class="setting-item">
                                <span class="setting-label" data-i18n="setting-audio-format">デフォルト形式</span>
                                <select id="setting-audio-format" class="setting-select">
                                    <option value="">(自動選択なし)</option>
                                    <option value="詳細" data-i18n="opt-detail">詳細</option>
                                    <option value="概要" data-i18n="opt-summary">概要</option>
                                    <option value="評論" data-i18n="opt-critique">評論</option>
                                    <option value="議論" data-i18n="opt-debate">議論</option>
                                </select>
                            </div>
                        </div>
                        <div class="cue-list" id="list-audio"></div>
                    </div>
                </section>

                <section class="category-section" data-category="video">
                    <div class="category-header" id="header-video">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-video">動画解説</span>
                        </div>
                        <button class="btn-add-category" data-category="video" title="動画解説にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-video"></div>
                    </div>
                </section>

                <section class="category-section" data-category="report">
                    <div class="category-header" id="header-report">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-report">レポート</span>
                        </div>
                        <button class="btn-add-category" data-category="report" title="レポートにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-report"></div>
                    </div>
                </section>

                <section class="category-section" data-category="flashcard">
                    <div class="category-header" id="header-flashcard">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-flashcard">フラッシュカード</span>
                        </div>
                        <button class="btn-add-category" data-category="flashcard" title="フラッシュカードにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-flashcard"></div>
                    </div>
                </section>

                <section class="category-section" data-category="quiz">
                    <div class="category-header" id="header-quiz">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-quiz">クイズ</span>
                        </div>
                        <button class="btn-add-category" data-category="quiz" title="クイズにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-quiz"></div>
                    </div>
                </section>

                <section class="category-section" data-category="infographic">
                    <div class="category-header" id="header-infographic">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-infographic">インフォグラフィック</span>
                        </div>
                        <button class="btn-add-category" data-category="infographic"
                            title="インフォグラフィックにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-infographic"></div>
                    </div>
                </section>

                <section class="category-section" data-category="slide">
                    <div class="category-header" id="header-slide">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-slide">スライド資料</span>
                        </div>
                        <button class="btn-add-category" data-category="slide" title="スライド資料にプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-slide"></div>
                    </div>
                </section>

                <section class="category-section" data-category="datatable">
                    <div class="category-header" id="header-datatable">
                        <div class="category-header-left">
                            <span class="arrow">▼</span>
                            <span class="title" data-i18n="cat-datatable">Data Table</span>
                        </div>
                        <button class="btn-add-category" data-category="datatable"
                            title="Data Tableにプロンプトを追加">＋</button>
                    </div>
                    <div class="category-content">
                        <div class="cue-list" id="list-datatable"></div>
                    </div>
                </section>
            </div>
        </div>

        <!-- プロンプトの追加・編集フォーム（常時表示） -->
        <div id="admin-section" class="admin-section">
            <h2 id="admin-title" data-i18n="admin-add-title">プロンプトの追加</h2>
            <input type="hidden" id="edit-index" value="-1">

            <div style="position: relative;">
                <input type="text" id="prompt-title" placeholder="タイトル（例: 銘柄分析）" maxlength="20"
                    data-i18n-placeholder="placeholder-title">
                <div id="title-char-count" class="char-counter">0 / 20</div>
            </div>

            <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 12px; color: #64748b; margin-bottom: 4px; display: block;"
                    data-i18n="label-category">カテゴリ</label>
                <select id="prompt-category"
                    style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px;">
                    <option value="research" data-i18n="cat-research">ソース検索</option>
                    <option value="audio" data-i18n="cat-audio">音声解説</option>
                    <option value="video" data-i18n="cat-video">動画解説</option>
                    <option value="report" data-i18n="cat-report">レポート</option>
                    <option value="flashcard" data-i18n="cat-flashcard">フラッシュカード</option>
                    <option value="quiz" data-i18n="cat-quiz">クイズ</option>
                    <option value="infographic" data-i18n="cat-infographic">インフォグラフィック</option>
                    <option value="slide" data-i18n="cat-slide">スライド資料</option>
                    <option value="datatable" data-i18n="cat-datatable">Data Table</option>
                </select>
            </div>

            <div style="position: relative;">
                <div id="tags-input-container" class="tags-input-container">
                    <input type="text" id="prompt-tags-input" placeholder="タグ (Enterで追加)"
                        data-i18n-placeholder="placeholder-tags">
                </div>
                <input type="hidden" id="prompt-tags">
                <div id="tags-char-count" class="char-counter">0 / 10個</div>
            </div>

            <div style="position: relative;">
                <textarea id="prompt-text" rows="18" placeholder="プロンプト内容" maxlength="5000"
                    data-i18n-placeholder="placeholder-text"></textarea>
                <div id="char-count" class="char-counter">0 / 5000</div>
            </div>

            <label
                style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; margin: 4px 0;">
                <input type="checkbox" id="prompt-favorite" style="width: auto; margin: 0;">
                <span data-i18n="label-favorite">⭐ お気に入り登録</span>
            </label>

            <div class="btn-group">
                <button id="save-btn" class="btn btn-primary" data-i18n="btn-save">保存</button>
                <button id="cancel-btn" class="btn btn-secondary" data-i18n="btn-cancel">キャンセル</button>
            </div>
        </div>
    </div>
    <div id="custom-confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="confirm-title" data-i18n="app-title">Prompt Manager for NotebookLM</h3>
            <p id="confirm-message"></p>
            <div class="btn-group">
                <button id="confirm-yes-btn" class="btn btn-primary">削除</button>
                <button id="confirm-no-btn" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>
    <script src="translations.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
